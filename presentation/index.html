<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA SEXTANT 3D &amp; xEMU AR HUD — Presentation</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="slides-data.js"></script>
  <script defer src="deck.js"></script>
</head>
<body>
  <canvas id="bg-mars-waves" aria-hidden="true"></canvas>
  <div class="hud-scanlines" aria-hidden="true"></div>

  <div class="deck-shell">
    <header class="deck-topbar">
      <div class="topbar-brand">
        <span class="brand-emblem" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="14" cy="14" r="10.5" opacity="0.45" />
            <ellipse cx="14" cy="14" rx="12.5" ry="5" transform="rotate(-24 14 14)" />
            <circle cx="14" cy="14" r="2.2" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <div class="brand-meta">
          <span class="brand-kicker" data-ui="brandKicker">NASA SPACE APPS // CHALLENGE #11</span>
          <strong class="brand-title" data-ui="brandTitle">SEXTANT 3D &amp; xEMU AR HUD</strong>
        </div>
      </div>

      <div class="topbar-progress">
        <div class="progress-meta">
          <span class="slide-counter" id="slide-counter">01 / 11</span>
          <span class="slide-timing-pill" id="slide-timing">0:00 – 0:30</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="11" aria-valuenow="1" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="lang-switch" role="group" aria-label="Presentation Language">
          <button type="button" class="lang-btn active" data-lang="en" id="btn-lang-en" aria-pressed="true">EN</button>
          <button type="button" class="lang-btn" data-lang="ja" id="btn-lang-ja" aria-pressed="false">日本語</button>
        </div>

        <div class="voice-control" role="group" aria-label="English Voiceover">
          <button type="button" class="top-btn top-btn-voice" id="btn-voice" title="English Voiceover (V)">
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M3.5 8v4h3.2l4.3 3.6V4.4L6.7 8H3.5z" />
              <path d="M13.8 7.2a4.2 4.2 0 0 1 0 5.6" />
              <path d="M15.8 5.2a7 7 0 0 1 0 9.6" />
            </svg>
            <span data-ui="btnVoice">Voice EN</span>
            <span class="voice-eq" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <button type="button" class="top-btn top-btn-auto" id="btn-auto-tour" title="Auto-Advance Slides (A)" aria-pressed="false">
            <span data-ui="btnAutoTour">Auto</span>
          </button>
        </div>

        <button type="button" class="top-btn" id="btn-notes" title="Speaker Notes (N)">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="2.5" width="14" height="15" rx="2" />
            <line x1="6.5" y1="7" x2="13.5" y2="7" />
            <line x1="6.5" y1="10.5" x2="13.5" y2="10.5" />
            <line x1="6.5" y1="14" x2="10.5" y2="14" />
          </svg>
          <span data-ui="btnNotes">Notes</span>
        </button>

        <button type="button" class="top-btn" id="btn-overview" title="Slide Overview (G)">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="2.5" y="2.5" width="6" height="6" rx="1.2" />
            <rect x="11.5" y="2.5" width="6" height="6" rx="1.2" />
            <rect x="2.5" y="11.5" width="6" height="6" rx="1.2" />
            <rect x="11.5" y="11.5" width="6" height="6" rx="1.2" />
          </svg>
          <span data-ui="btnOverview">Grid</span>
        </button>

        <button type="button" class="top-btn" id="btn-print" title="Print / Export PDF (P)">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M5 7V3h10v4" />
            <rect x="3" y="7" width="14" height="7" rx="1.5" />
            <rect x="5.5" y="11.5" width="9" height="5.5" fill="#05080f" />
          </svg>
          <span data-ui="btnPrint">PDF</span>
        </button>

        <button type="button" class="top-btn top-btn-accent" id="btn-fullscreen" title="Fullscreen (F)">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" />
          </svg>
          <span data-ui="btnFullscreen">Fullscreen</span>
        </button>
      </div>
    </header>

    <main class="deck-stage" id="deck-stage">
      <article class="slide-frame" id="slide-frame" aria-live="polite"></article>
    </main>

    <aside class="notes-drawer hidden" id="notes-drawer" aria-label="Speaker Notes">
      <div class="notes-header">
        <div class="notes-title-wrap">
          <span class="notes-dot"></span>
          <strong data-ui="notesHeading">Speaker Script Cue (6-Min Keynote)</strong>
          <span class="notes-slide-badge" id="notes-slide-badge">01</span>
        </div>
        <button type="button" class="notes-close" id="btn-close-notes" aria-label="Close Notes">×</button>
      </div>
      <div class="notes-body" id="notes-body"></div>
    </aside>

    <footer class="deck-footer">
      <div class="footer-left">
        <button type="button" class="nav-btn" id="btn-prev">
          <span aria-hidden="true">←</span>
          <span data-ui="btnPrev">Prev</span>
        </button>
        <button type="button" class="nav-btn nav-btn-primary" id="btn-next">
          <span data-ui="btnNext">Next</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>

      <nav class="slide-dots" id="slide-dots" aria-label="Slide Navigation"></nav>

      <div class="footer-right">
        <span class="shortcut-hint" data-ui="shortcutHint">← → Navigate · N Notes · G Grid · L EN/日本語 · F Fullscreen</span>
      </div>
    </footer>
  </div>

  <div class="overview-modal hidden" id="overview-modal" role="dialog" aria-modal="true" aria-labelledby="overview-title">
    <div class="overview-panel">
      <div class="overview-header">
        <h2 id="overview-title" data-ui="overviewTitle">Slide Deck Overview — 11 Slides</h2>
        <button type="button" class="notes-close" id="btn-close-overview" aria-label="Close Overview">×</button>
      </div>
      <div class="overview-grid" id="overview-grid"></div>
    </div>
  </div>

  <section class="print-deck" id="print-deck" aria-hidden="true"></section>
</body>
</html>
